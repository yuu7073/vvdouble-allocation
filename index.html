<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VV DOUBLE 採購配貨中心</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2333415C%22%2F%3E%3Cg%20transform%3D%22translate(0%2C7)%22%3E%3Cpath%20d%3D%22M32%2020%20v-2%20a5.5%205.5%200%201%201%205.5%20-5.5%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M32%2021%20L11%2039%20a3.5%203.5%200%200%200%202.3%206.2%20h37.4%20a3.5%203.5%200%200%200%202.3%20-6.2%20Z%22%20fill%3D%22%23ED7D31%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
:root{
  --blue:#4472C4; --blue-dark:#2F5597; --blue-light:#EDF1F8;
  --orange:#ED7D31; --orange-light:#FDF0E5;
  --bg:#DEE5F2; --card:#FFFFFF; --ink:#33415C; --muted:#7A869C;
  --line:#D5DCEA; --ok:#3E8E5A; --danger:#C0392B;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{position:sticky;top:0;z-index:50;background:var(--card);box-shadow:0 1px 4px rgba(51,65,92,.12)}
.hin{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hbrand{font-size:17px;font-weight:800;letter-spacing:1px;color:var(--ink)}
.hbrand span{color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(51,65,92,.08);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}}
.stat{background:var(--blue-light);border-radius:10px;padding:12px 14px}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .num{font-size:26px;font-weight:800;color:var(--ink);line-height:1.3}
.stat .num.hl{color:var(--orange)}
.stat .note{font-size:12px;color:var(--muted)}
.bar-track{background:#E4EAF4;border-radius:6px;height:14px;overflow:hidden;position:relative}
.bar-fill{background:var(--blue);height:100%;border-radius:6px;min-width:2px;transition:width .3s}
.bar-fill.orange{background:var(--orange)}
.bar-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin-bottom:8px}
.bar-row .bl{font-size:13px;display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right}
.bar-row .bv{font-size:13px;font-weight:700;white-space:nowrap}
.bar-row .bv small{color:var(--muted);font-weight:400}
.swatch{width:14px;height:14px;border-radius:4px;border:1px solid rgba(51,65,92,.25);display:inline-block;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn{border:none;border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn-warn{background:var(--orange);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.tbl{border-collapse:collapse;width:100%;background:#fff}
.tbl th{background:var(--blue);color:#fff;padding:7px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center;font-size:13px}
.tbl tfoot td{background:var(--blue-light);font-weight:700}
.tbl input,.tbl select{width:100%;min-width:44px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;font-size:13px;text-align:center;font-family:inherit;background:#fff}
.tbl input:focus,.tbl select:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.tscroll{overflow-x:auto}
.diff-warn{color:var(--orange);font-weight:800}
.diff-ok{color:var(--ok);font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.fld textarea{resize:vertical;min-height:64px}
.imgbox{border:2px dashed var(--line);border-radius:10px;min-height:140px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:var(--blue-light)}
.imgbox img{max-width:100%;max-height:220px;display:block}
.imgbox .ph{color:var(--muted);font-size:13px;text-align:center;padding:20px}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.item-card .thumb{height:150px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;overflow:hidden}
.item-card .thumb img{width:100%;height:100%;object-fit:cover}
.item-card .thumb .noimg{color:var(--muted);font-size:12px}
.item-card .ib{padding:10px 12px;flex:1}
.item-card .sn{font-weight:800;font-size:15px}
.item-card .meta{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.item-card .foot{display:flex;gap:6px;padding:0 12px 10px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700}
.badge-blue{background:var(--blue-light);color:var(--blue-dark)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.tag-x{display:inline-flex;align-items:center;gap:6px;background:var(--blue-light);border-radius:14px;padding:4px 8px 4px 12px;font-size:13px;margin:3px}
.tag-x b{cursor:pointer;color:var(--muted);font-weight:700}
.tag-x b:hover{color:var(--danger)}
.inline-add{display:flex;gap:6px;margin-top:8px}
.inline-add input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;width:130px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
#toast.show{opacity:1}
#login{position:fixed;inset:0;background:var(--bg);z-index:150;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:14px;padding:32px;width:320px;box-shadow:0 4px 20px rgba(51,65,92,.15);text-align:center}
.login-box h2{margin:0 0 6px;font-size:18px}
.login-box p{color:var(--muted);font-size:13px;margin:0 0 16px}
.login-box input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;text-align:center;margin-bottom:12px;font-family:inherit}
.demo-banner{background:var(--orange);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:5px}
.sec-title{font-size:13px;font-weight:800;color:var(--blue-dark);margin:14px 0 8px;border-left:4px solid var(--blue);padding-left:8px}
.hint{font-size:12px;color:var(--muted)}
.month-card .mth{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.month-card .mth .mname{font-size:17px;font-weight:800}
.pd-row{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;align-items:center}
.pd-row .pn{font-weight:800}
.pd-row .pm{font-size:12px;color:var(--muted);line-height:1.7}
.mini-input{width:90px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;text-align:center;font-family:inherit}
a{color:var(--blue)}
.rt-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:6px 8px;background:var(--blue-light)}
.rt-bar button{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:28px;height:26px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink);padding:0 6px}
.rt-bar button:hover{border-color:var(--blue)}
.rt-bar select{width:auto;min-width:0;border:1px solid var(--line);border-radius:6px;height:26px;font-size:12px;font-family:inherit;background:#fff;padding:0 4px}
.rt-bar .rt-dot{width:20px;height:20px;min-width:20px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.rt-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rt-area{border:1px solid var(--line);border-radius:0 0 8px 8px;min-height:130px;padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);line-height:1.7;outline:none}
.rt-area:focus{border-color:var(--blue);outline:2px solid var(--blue)}
.rt-area:empty::before{content:'例：請依照樣板做貨，尺寸表確認後才能做貨…';color:var(--muted)}
#sheetModal{position:fixed;inset:0;background:rgba(51,65,92,.55);z-index:120;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px}
.sheet-panel{background:#F2F5FA;border-radius:12px;max-width:900px;width:100%;padding:14px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
#sheetBody{background:#fff;padding:28px;border:1px solid var(--line)}
.sh-title{font-size:20px;font-weight:800;color:var(--ink);text-align:center;margin-bottom:4px;letter-spacing:2px}
.sh-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
.sh-tbl{border-collapse:collapse;width:100%;margin-bottom:14px}
.sh-tbl th{background:var(--blue);color:#fff;font-size:12px;padding:6px 8px;border:1px solid var(--blue-dark);white-space:nowrap}
.sh-tbl td{border:1px solid #B9C4DA;padding:6px 8px;font-size:13px;text-align:center;color:var(--ink)}
.sh-tbl td.lbl{background:var(--blue-light);font-weight:700;font-size:12px;white-space:nowrap}
.sh-2col{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-bottom:14px}
.sh-imgbox{border:1px solid #B9C4DA;min-height:220px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#FAFBFD;padding:6px}
.sh-imgbox img{max-width:100%;max-height:260px}
.sh-notes{border:1px solid #B9C4DA;padding:10px 12px;font-size:13px;line-height:1.8;min-height:220px}
.sh-notes .nt{font-size:12px;font-weight:800;color:var(--blue-dark);margin-bottom:6px}
.sh-key{border-collapse:collapse;margin:0 0 14px;width:100%;max-width:440px}
.sh-key td{border:2px solid #111;padding:8px 14px;font-size:19px;font-weight:900;color:#111;text-align:center;letter-spacing:1px}
.sh-key td.k{width:46%}
.sh-foot{margin-top:12px;font-size:12px;color:var(--ink);line-height:1.9;border-top:2px solid var(--blue);padding-top:8px}
@media print{
  body>*{display:none !important}
  #sheetModal{display:flex !important;position:static;background:#fff;padding:0}
  .sheet-panel{max-width:none;padding:0;background:#fff}
  .sheet-actions{display:none !important}
  #sheetBody{border:none}
}
#hoverPreview{position:fixed;z-index:170;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 32px rgba(51,65,92,.35);padding:6px}
#hoverPreview img{max-width:360px;max-height:440px;display:block;border-radius:6px}
#lightbox{position:fixed;inset:0;background:rgba(20,26,40,.85);z-index:180;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
#lightbox img{max-width:94vw;max-height:92vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);background:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb-tile{position:relative;width:86px;height:104px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--blue-light)}
.thumb-tile img{width:100%;height:100%;object-fit:cover}
.thumb-tile b{position:absolute;top:2px;right:2px;background:rgba(51,65,92,.78);color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:11px;cursor:pointer}
.thumb-add{width:86px;height:104px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;cursor:pointer;background:var(--blue-light)}
.tag-hidden{display:inline-flex;align-items:center;gap:6px;background:#EDEFF3;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:4px 8px 4px 12px;font-size:13px;margin:3px;cursor:pointer}
.tag-hidden b{cursor:pointer;font-weight:700}
.tag-hidden b:hover{color:var(--danger)}
.tag-x{cursor:grab}
.tag-x img{vertical-align:middle}
.tagzone{min-height:34px}
.boardmode .wrap{max-width:none;padding:0}
.tb-ic{width:34px;height:34px;min-width:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink);flex:none;font-family:inherit}
.tb-ic:hover{border-color:var(--blue);color:var(--blue-dark)}
.tb-ic.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.tb-ic:disabled{opacity:.3;cursor:default}
.tb-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bdTextTools{position:fixed;z-index:350;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(51,65,92,.28);display:flex;gap:4px;padding:6px;align-items:center}
.tt-btn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);padding:0}
.tt-btn:hover{border-color:var(--blue)}
.tt-dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.tt-sep{width:1px;height:20px;background:var(--line)}
#ttColor{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff;cursor:pointer}
.bd-lib-h{padding:8px 10px;font-size:13px;font-weight:800;background:var(--blue-light);cursor:pointer;border-bottom:1px solid var(--line);color:var(--blue-dark);user-select:none}
.bd-lib-h:hover{background:#DCE6F5}
#bdTopbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.tb-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;flex:none}
.tb-btn:hover{border-color:var(--blue)}
.tb-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.tb-btn:disabled{opacity:.35;cursor:default}
.tb-sep{width:1px;height:26px;background:var(--line);flex:none;margin:0 2px}
#bdZoomPct{min-width:44px;text-align:center;font-size:13px;font-weight:700;flex:none}
.note-dot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;flex:none;padding:0}
#bdBody{display:flex;align-items:stretch}
#bdViewport{position:relative;flex:1;height:calc(100vh - 132px);overflow:hidden;cursor:grab;background-image:radial-gradient(circle,#C2CDE0 1px,transparent 1px);background-size:26px 26px;background-color:#E7ECF5}
#bdViewport.panning{cursor:grabbing}
#bdWorld{position:absolute;left:0;top:0;transform-origin:0 0}
.bd-item{position:absolute;user-select:none}
.bd-item.sel{outline:2px solid var(--blue);outline-offset:1px}
.bd-img{background:#fff;border-radius:6px;box-shadow:0 4px 14px rgba(51,65,92,.18)}
.bd-img img{width:100%;height:100%;display:block;pointer-events:none;border-radius:6px}
.bd-note{box-shadow:0 5px 14px rgba(51,65,92,.22);padding:14px;font-size:16px;line-height:1.5;overflow:hidden;word-break:break-word}
.bd-text{font-weight:800;color:var(--ink);line-height:1.35;word-break:break-word}
.bd-swatch{border-radius:10px;box-shadow:0 4px 12px rgba(51,65,92,.2);border:1px solid rgba(51,65,92,.12)}
.bd-label{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.bd-corner{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--blue);border-radius:50%;opacity:0;z-index:6}
.bd-item:hover .bd-corner,.bd-item.sel .bd-corner{opacity:1}
.bd-corner[data-c="nw"]{left:-8px;top:-8px;cursor:nwse-resize}
.bd-corner[data-c="ne"]{right:-8px;top:-8px;cursor:nesw-resize}
.bd-corner[data-c="sw"]{left:-8px;bottom:-8px;cursor:nesw-resize}
.bd-corner[data-c="se"]{right:-8px;bottom:-8px;cursor:nwse-resize}
.bd-handle{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--blue);border-radius:50%;right:-9px;bottom:-9px;cursor:nwse-resize;z-index:5}
.bd-guide{position:absolute;background:#FF4FA0;pointer-events:none;z-index:999}
#bdMarquee{position:absolute;border:1.5px solid var(--blue);background:rgba(68,114,196,.12);display:none;z-index:90;pointer-events:none}
#bdDrawer{width:230px;border-left:1px solid var(--line);background:#fff;height:calc(100vh - 132px);overflow-y:auto;flex:none}
.bd-lib{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--blue-light)}
.bd-lib:hover{background:var(--blue-light)}
.bd-lib img{width:44px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.bd-lib span{font-size:13px;font-weight:700}
#cropOverlay{position:fixed;inset:0;background:rgba(20,26,40,.82);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#cropStage{position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#cropStage img{display:block;width:100%;height:100%;pointer-events:none}
#cropRect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}
.crop-h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--blue);border-radius:50%}
.crop-h[data-h="nw"]{left:-8px;top:-8px;cursor:nwse-resize}
.crop-h[data-h="ne"]{right:-8px;top:-8px;cursor:nesw-resize}
.crop-h[data-h="sw"]{left:-8px;bottom:-8px;cursor:nesw-resize}
.crop-h[data-h="se"]{right:-8px;bottom:-8px;cursor:nwse-resize}
.crop-btns{display:flex;gap:10px}
.crop-btns button{border:none;border-radius:8px;padding:10px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.bd-editing{outline:2px dashed var(--orange) !important;cursor:text}
hidden,[hidden]{display:none !important}
</style>
</head>
<body>
<div id="demoBanner" class="demo-banner" hidden>示範模式：資料只存在本頁，不會寫入資料庫（網址去掉 ?demo 即為正式版）</div>
<header>
  <div class="hin">

/* ---------- 小工具 ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){v=Number(v);return isFinite(v)?v:0;}
function fmt(n){return num(n).toLocaleString('zh-Hant');}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show');},2200);}
function todayMonth(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function swatchOf(c){return SWATCH[c]||'#CBD3E0';}
function emailKey(e){return String(e||'').toLowerCase().replace(/\./g,',');}
function cleanHtml(html){
  var d=document.createElement('div');d.innerHTML=String(html||'');
  var all=d.querySelectorAll('*');
  for(var i=all.length-1;i>=0;i--){
    var el2=all[i];var tag=el2.tagName.toLowerCase();
    if(['b','i','u','em','strong','font','span','div','br','p'].indexOf(tag)<0){
      if(el2.parentNode)el2.parentNode.removeChild(el2);continue;
    }
    for(var j=el2.attributes.length-1;j>=0;j--){
      var a=el2.attributes[j];var n=a.name.toLowerCase();var v=String(a.value||'').toLowerCase();
      var ok=(n==='style'&&v.indexOf('expression')<0&&v.indexOf('url(')<0&&v.indexOf('javascript')<0)||(tag==='font'&&(n==='color'||n==='size'));
      if(!ok)el2.removeAttribute(a.name);
    }
  }
  return d.innerHTML;
}
function imgSrc(u){u=String(u||'');return u.indexOf('data:image')===0?u:'';}
function isAdmin(){return ROLE==='admin';}
function arr(v){if(Array.isArray(v))return v.filter(function(x){return x!=null;});if(v&&typeof v==='object')return Object.keys(v).sort().map(function(k){return v[k];}).filter(function(x){return x!=null;});return [];}
function allColors(){return (CONFIG.baseColors||[]).concat(CONFIG.accentColors||[]);}
function colorType(c){return (CONFIG.baseColors||[]).indexOf(c)>=0?'base':'accent';}
function groupOf(cat){var g='';(CONFIG.categories||[]).forEach(function(c){if((c.items||[]).indexOf(cat)>=0)g=c.name;});return g;}
function periodsOfMonth(m){return Object.keys(PERIODS).filter(function(id){return PERIODS[id].month===m;}).sort(function(a,b){return (PERIODS[a].date||'')<(PERIODS[b].date||'')?-1:1;});}
function monthList(){var s={};Object.keys(PERIODS).forEach(function(id){if(PERIODS[id].month)s[PERIODS[id].month]=1;});Object.keys(MONTHS).forEach(function(m){s[m]=1;});return Object.keys(s).sort().reverse();}

/* ---------- 資料層（Firebase / 示範模式共用） ---------- */
var MOCK={}, mockListeners=[], mockKey=1;
function pGet(obj,path){var parts=path.split('/').filter(Boolean),cur=obj;for(var i=0;i<parts.length;i++){if(cur==null)return null;cur=cur[parts[i]];}return cur==null?null:cur;}
function pSet(obj,path,val){var parts=path.split('/').filter(Boolean),cur=obj;for(var i=0;i<parts.length-1;i++){if(cur[parts[i]]==null||typeof cur[parts[i]]!=='object')cur[parts[i]]={};cur=cur[parts[i]];}if(val===null)delete cur[parts[parts.length-1]];else cur[parts[parts.length-1]]=val;}
function mockFire(){mockListeners.forEach(function(l){l.cb(pGet(MOCK,l.path));});}
function dbOn(path,cb){if(DEMO){mockListeners.push({path:path,cb:cb});cb(pGet(MOCK,path));}else{db.ref(path).on('value',function(s){cb(s.val());});}}
function dbSet(path,val){if(DEMO){pSet(MOCK,path,JSON.parse(JSON.stringify(val)));mockFire();}else{db.ref(path).set(val);}}
function dbUpdate(path,val){if(DEMO){Object.keys(val).forEach(function(k){pSet(MOCK,path+'/'+k,val[k]);});mockFire();}else{db.ref(path).update(val);}}
function dbPush(path,val){var k;if(DEMO){k='demo'+(mockKey++);pSet(MOCK,path+'/'+k,JSON.parse(JSON.stringify(val)));mockFire();}else{k=db.ref(path).push(val).key;}return k;}
function dbRemove(path){if(DEMO){pSet(MOCK,path,null);mockFire();}else{db.ref(path).remove();}}

function normalizeConfig(v){
  var c=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  ['stores','baseColors','accentColors','sizes','styleTypes','vendors','freights','labelTypes','tagTypes'].forEach(function(k){if(v[k])c[k]=arr(v[k]).map(String);});
  if(v.categories)c.categories=arr(v.categories).map(function(g){return {name:g.name||'',pct:num(g.pct),items:arr(g.items||[]).map(String)};});
  if(v.accessories)c.accessories=arr(v.accessories).map(function(a){return (a&&typeof a==='object')?{name:a.name||'',image:a.image||''}:{name:String(a),image:''};});
  c.hidden={};
  if(v.hidden){Object.keys(v.hidden).forEach(function(k){
    c.hidden[k]=arr(v.hidden[k]).map(function(x){
      if(k==='accessories')return (x&&typeof x==='object')?{name:x.name||'',image:x.image||''}:{name:String(x),image:''};
      return String((x&&typeof x==='object')?x.name:x);
    });
  });}
  if(v.password)c.password=v.password;
  return c;
}

/* ---------- 啟動 ---------- */
function init(){
  wireStatic();
  if(DEMO){
    $('demoBanner').hidden=false;seedDemo();
    ROLE=/[?&]role=staff/.test(location.search)?'staff':'admin';
    startData();return;
  }
  if(typeof firebase==='undefined'){document.body.insertAdjacentHTML('afterbegin','<div class="demo-banner">無法載入 Firebase，請檢查網路後重新整理</div>');return;}
  firebase.initializeApp(firebaseConfig);
  db=firebase.database();auth=firebase.auth();
  auth.onAuthStateChanged(function(u){
    if(!u){USER=null;ROLE=null;$('login').hidden=false;$('userBox').hidden=true;return;}
    USER=u;
    function grant(r){
      ROLE=r.role;
      $('login').hidden=true;$('userBox').hidden=false;
      $('userEmail').textContent=(r.name?r.name+'｜':'')+u.email+(ROLE==='admin'?'（主管）':'（一般）');
      startData();
    }
    function deny(){var e2=$('loginErr');e2.textContent='此帳號尚未授權，請聯絡主管開通';e2.hidden=false;auth.signOut();}
    db.ref(ROOT+'/roles/'+u.uid).once('value').then(function(s){
      var r=s.val();
      if(r&&r.role){grant(r);return;}
      db.ref(ROOT+'/roles/'+emailKey(u.email)).once('value').then(function(s2){
        var r2=s2.val();
        if(!r2||!r2.role){deny();return;}
        db.ref(ROOT+'/roles/'+u.uid).set({email:u.email,role:r2.role,name:r2.name||''}).catch(function(){});
        grant(r2);
      }).catch(deny);
    }).catch(function(){var e3=$('loginErr');e3.textContent='讀取權限失敗，請重新整理';e3.hidden=false;});
  });
}
function startData(){
  if(dataStarted){refresh();return;}
  dataStarted=true;
  dbOn(ROOT+'/config',function(v){
    if(!v){CONFIG=JSON.parse(JSON.stringify(DEFAULT_CONFIG));if(!DEMO)dbSet(ROOT+'/config',DEFAULT_CONFIG);}
    else CONFIG=normalizeConfig(v);
    buildFormStatic();refresh();
  });
  dbOn(ROOT+'/months',function(v){MONTHS=v||{};refresh();});
  dbOn(ROOT+'/periods',function(v){PERIODS=v||{};if(!ovMonth){var ms=monthList();ovMonth=ms[0]||todayMonth();}if(CONFIG)fillPeriodSelect();refresh();});
  dbOn(ROOT+'/items',function(v){ITEMS=v||{};refresh();});
  dbOn(ROOT+'/roles',function(v){ROLES=v||{};if(currentTab==='settings')refresh();});
  dbOn(ROOT+'/boardsMeta',function(v){BOARDSMETA=v||{};if(currentTab==='board')renderBoardShell();});
}
function doLogin(){
  var em=$('loginEmail').value.trim(),pw=$('loginPw').value;
  if(!em||!pw){$('loginErr').textContent='請輸入 Email 與密碼';$('loginErr').hidden=false;return;}
  $('loginErr').hidden=true;
  auth.signInWithEmailAndPassword(em,pw).catch(function(){$('loginErr').textContent='登入失敗：帳號或密碼錯誤';$('loginErr').hidden=false;});
}

var tabHistory=[];
function switchTab(t,noPush){
  if(!noPush&&t!==currentTab){tabHistory.push(currentTab);if(tabHistory.length>20)tabHistory.shift();}
  currentTab=t;
  document.querySelectorAll('.tab').forEach(function(b){if(b.dataset.tab)b.classList.toggle('active',b.dataset.tab===t);});
  ['overview','form','list','board','periods','settings'].forEach(function(p){$('page-'+p).hidden=(p!==t);});
  document.body.classList.toggle('boardmode',t==='board');
  $('backBtn').hidden=tabHistory.length===0;
  refresh();
}
function goBack(){var prev=tabHistory.pop();if(prev!=null)switchTab(prev,true);$('backBtn').hidden=tabHistory.length===0;}
function refresh(){
  if(!CONFIG)return;
  if(currentTab==='overview')renderOverview();
  else if(currentTab==='list')renderList();
  else if(currentTab==='board')renderBoardShell();
  else if(currentTab==='periods')renderPeriods();
  else if(currentTab==='settings')renderSettings();
}

function updateDetailTotals(){
  var storeT={},webT=0,orderT=0,allocT=0;
  CONFIG.stores.forEach(function(s){storeT[s]=0;});
  formRows.forEach(function(r,i){
    var a=0;
    CONFIG.stores.forEach(function(s){var v=num(r.alloc&&r.alloc[s]);a+=v;storeT[s]+=v;});
    a+=num(r.web);webT+=num(r.web);orderT+=num(r.orderQty);allocT+=a;
    var d=num(r.orderQty)-a;
    var e1=$('rsum'+i),e2=$('rdiff'+i);
    if(e1)e1.textContent=a;
    if(e2){e2.textContent=d;e2.className=d===0?'diff-ok':(d<0?'diff-warn':'');}
  });
  var diff=orderT-allocT;
  var f='<tr><td colspan="2">合計</td><td>'+fmt(orderT)+'</td>';
  CONFIG.stores.forEach(function(s){f+='<td>'+fmt(storeT[s])+'</td>';});
  f+='<td>'+fmt(webT)+'</td><td>'+fmt(allocT)+'</td><td class="'+(diff<0?'diff-warn':'')+'">'+fmt(diff)+'</td><td></td></tr>';
  $('detailFoot').innerHTML=f;
}
function onDetailEdit(e){

  else if(t.dataset.f==='color'||t.dataset.f==='size')r[t.dataset.f]=t.value;
  else if(t.dataset.f)r[t.dataset.f]=num(t.value);
  updateDetailTotals();
}

function compressImage(file,cb,maxSide){
  var img=new Image();
  img.onload=function(){
    var max=maxSide||900,w=img.width,h=img.height;
    if(w>=h&&w>max){h=h*max/w;w=max;}else if(h>w&&h>max){w=w*max/h;h=max;}
    var cv=document.createElement('canvas');cv.width=Math.round(w);cv.height=Math.round(h);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    var q=0.8,url=cv.toDataURL('image/jpeg',q);
    while(url.length>260000&&q>0.3){q-=0.12;url=cv.toDataURL('image/jpeg',q);}
    cb(url);
  };
  img.src=URL.createObjectURL(file);
}

/* ---------- 檔期管理 ---------- */
function renderPeriods(){
  var el=$('page-periods');
  var html=!isAdmin()?'':'<div class="card"><h3 id="pFormTitle">'+(editPeriodId?'編輯檔期':'新增檔期')+'</h3><div class="form-grid">'+
    '<div class="fld"><label>月份 *</label><input id="p_month" type="month"></div>'+
    '<div class="fld"><label>檔期名稱 *</label><input id="p_name" placeholder="例：8/25檔"></div>'+
    '<div class="fld"><label>上架日期</label><input id="p_date" type="date"></div>'+
    '<div class="fld"><label>檔期下單目標（件）</label><input id="p_target" type="number" min="0" placeholder="例：4500"></div>'+
    '<div class="fld"><label>系列主題</label><input id="p_theme"></div>'+
    '<div class="fld"><label>色彩占比</label><input id="p_colorRatio" placeholder="例：粉 藍 黃 橙"></div>'+
    '<div class="fld"><label>系列元素</label><input id="p_elements" placeholder="例：格紋 流蘇 大口袋"></div>'+
    '<div class="fld" style="display:flex;align-items:flex-end;gap:6px"><button class="btn btn-primary" id="p_add" style="flex:1">'+(editPeriodId?'更新檔期':'＋ 建立檔期')+'</button>'+(editPeriodId?'<button class="btn btn-ghost" id="p_cancel">取消</button>':'')+'</div>'+
    '</div></div>';
  var ms=monthList();
  if(!ms.length)html+='<div class="card"><div class="empty">還沒有任何檔期，先在上面建立一個</div></div>';
  ms.forEach(function(m){
    var pids=periodsOfMonth(m);
    var target=num(MONTHS[m]&&MONTHS[m].target);
    var mPieces=0;itemsOfPeriods(pids).forEach(function(id){mPieces+=itemOrderTotal(ITEMS[id]);});
    var pct=target>0?Math.round(mPieces/target*1000)/10:null;
    html+='<div class="card month-card"><div class="mth"><div class="mname">'+m+'</div>'+
      (isAdmin()?'<div>月下單目標 <input class="mini-input" data-mtarget="'+m+'" value="'+(target||'')+'"> 件</div>':'<div>月下單目標 '+(target?fmt(target):'未設定')+' 件</div>')+
      '<div>已下單 <b style="color:var(--orange)">'+fmt(mPieces)+'</b> 件'+(pct!=null?'（'+pct+'%）':'')+'</div>'+
      (function(){var tsum=0;pids.forEach(function(pid){tsum+=num(PERIODS[pid].target);});
        if(!tsum&&!target)return '';
        var ok=(!target||tsum===target);
        return '<div>各檔目標合計 '+(ok?fmt(tsum):'<b style="color:var(--orange)">'+fmt(tsum)+'</b>')+' 件'+(target&&!ok?'（與月目標差 '+fmt(target-tsum)+' 件）':'')+'</div>';})()+
      '</div>';
    pids.forEach(function(pid){
      var p=PERIODS[pid];
      var pi=itemsOfPeriods([pid]);var pieces=0,aq=0,wq=0;
      pi.forEach(function(id){pieces+=itemOrderTotal(ITEMS[id]);aq+=itemAllocTotalCfg(ITEMS[id]);arr(ITEMS[id].rows).forEach(function(r){wq+=num(r.web);});});
      html+='<div class="pd-row"><div><div class="pn">'+esc(p.name||'')+'　<span class="hint">'+esc(p.date||'')+'</span></div>'+
        '<div class="pm">主題：'+esc(p.theme||'—')+'｜色彩：'+esc(p.colorRatio||'—')+'｜元素：'+esc(p.elements||'—')+'<br>檔期目標 '+(isAdmin()?'<input class="mini-input" data-ptarget="'+pid+'" value="'+(p.target||'')+'">':'<b>'+(p.target?fmt(p.target):'未設定')+'</b>')+' 件｜下單 '+fmt(pieces)+' 件（'+(num(p.target)>0?Math.round(pieces/num(p.target)*100)+'%':'—')+'）｜已配 '+fmt(aq)+' 件｜官網 <b>'+fmt(wq)+'</b> 件（'+(aq>0?Math.round(wq/aq*100)+'%':'—')+'）</div></div>'+
        (isAdmin()?'<div style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-ghost btn-sm" data-pedit="'+pid+'">編輯</button><button class="btn btn-ghost btn-sm" data-pdel="'+pid+'" style="color:var(--danger)">刪除</button></div>':'')+'</div>';
    });
    html+='</div>';
  });
  el.innerHTML=html;
  if($('p_month')&&editPeriodId&&PERIODS[editPeriodId]){
    var p=PERIODS[editPeriodId];
    $('p_month').value=p.month||todayMonth();$('p_name').value=p.name||'';$('p_date').value=p.date||'';
    $('p_target').value=p.target||'';$('p_theme').value=p.theme||'';$('p_colorRatio').value=p.colorRatio||'';$('p_elements').value=p.elements||'';
    $('p_cancel').addEventListener('click',function(){editPeriodId=null;renderPeriods();});
  }else if($('p_month')){$('p_month').value=todayMonth();}
  if($('p_add'))$('p_add').addEventListener('click',function(){
    var m=$('p_month').value,n=$('p_name').value.trim();
    if(!m||!n){toast('請填月份與檔期名稱');return;}
    var data={month:m,name:n,date:$('p_date').value,target:num($('p_target').value),theme:$('p_theme').value.trim(),colorRatio:$('p_colorRatio').value.trim(),elements:$('p_elements').value.trim()};
    var needMonth=!MONTHS[m];
    if(editPeriodId){dbUpdate(ROOT+'/periods/'+editPeriodId,data);toast('已更新檔期');editPeriodId=null;}
    else{data.createdAt=Date.now();dbPush(ROOT+'/periods',data);toast('已建立檔期：'+n);}
    if(needMonth)dbSet(ROOT+'/months/'+m,{target:0});
    renderPeriods();
  });
  el.querySelectorAll('[data-mtarget]').forEach(function(inp){inp.addEventListener('change',function(){dbSet(ROOT+'/months/'+inp.dataset.mtarget+'/target',num(inp.value));toast('已更新月目標');});});
  el.querySelectorAll('[data-ptarget]').forEach(function(inp){inp.addEventListener('change',function(){dbSet(ROOT+'/periods/'+inp.dataset.ptarget+'/target',num(inp.value));toast('已更新檔期目標');});});
  el.querySelectorAll('[data-pdel]').forEach(function(b){b.addEventListener('click',function(){
    var pid=b.dataset.pdel;var used=itemsOfPeriods([pid]).length;
    if(used>0){alert('此檔期底下還有 '+used+' 款，請先刪除或把款式改掛其他檔期');return;}
    if(confirm('刪除檔期「'+(PERIODS[pid].name||'')+'」？')){dbRemove(ROOT+'/periods/'+pid);toast('已刪除');}
  });});
  el.querySelectorAll('[data-pedit]').forEach(function(b){b.addEventListener('click',function(){editPeriodId=b.dataset.pedit;renderPeriods();window.scrollTo(0,0);});});
}

function createAccount(){
  if(DEMO){toast('示範模式不能建立帳號');return;}
  var nm=$('ac_name').value.trim(),em=$('ac_email').value.trim(),pw=$('ac_pw').value,role=$('ac_role').value;
  if(!em||em.indexOf('@')<0){toast('請填正確 Email');return;}
  if(!pw||pw.length<8){toast('初始密碼至少 8 碼');return;}
  function done(key){
    dbSet(ROOT+'/roles/'+key,{email:em,role:role,name:nm||''});
    $('ac_name').value='';$('ac_email').value='';$('ac_pw').value='';
    toast('已建立並授權：'+em);
  }
  var sec=firebase.initializeApp(firebaseConfig,'sec'+Date.now());
  sec.auth().createUserWithEmailAndPassword(em,pw)
    .then(function(cred){
      var uid=cred.user.uid;
      sec.auth().signOut();try{sec.delete();}catch(x){}
      done(uid);
    })
    .catch(function(e){
      try{sec.delete();}catch(x){}
      if(e&&e.code==='auth/email-already-in-use'){done(emailKey(em));toast('帳號已存在，已直接授權');}
      else toast('建立失敗：'+(e&&e.message||''));
    });
}
function wireSettingsStatic(){
  var root=$('page-settings');
  root.addEventListener('click',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.add){
      var key=t.dataset.add,inp=$('add_'+key),v=inp.value.trim();if(!v)return;
      if(getList(key).some(function(x){return dispName(x)===v;})||hiddenList(key).some(function(x){return dispName(x)===v;})){toast('已存在（或在隱藏區）');return;}
      getList(key).push(v);saveCfgAll();toast('已加入 '+v);return;
    }
    if(t.dataset&&t.dataset.hide!=null){
      var k=t.dataset.hide,i=Number(t.dataset.hi);
      var v2=getList(k).splice(i,1)[0];hiddenList(k).push(v2);
      saveCfgAll();toast('已隱藏 '+dispName(v2)+'（可在下方恢復）');return;
    }
    if(t.dataset&&t.dataset.realdel!=null){
      var k3=t.dataset.realdel,i3=Number(t.dataset.di),h3=hiddenList(k3);
      if(!confirm('永久刪除「'+dispName(h3[i3])+'」？此動作無法復原'))return;
      h3.splice(i3,1);saveCfgAll();toast('已永久刪除');return;
    }
    var rs=t.closest('[data-restore]');
    if(rs){
      var k4=rs.dataset.restore,i4=Number(rs.dataset.ri),h4=hiddenList(k4);
      var v4=h4.splice(i4,1)[0];getList(k4).push(v4);
      saveCfgAll();toast('已恢復 '+dispName(v4));return;
    }
    if(t.id==='acc_pick'){$('acc_img').click();return;}
    if(t.id==='acc_add'){
      var nm=$('acc_name').value.trim();if(!nm){toast('請填輔料名稱');return;}
      if((CONFIG.accessories||[]).some(function(a){return a.name===nm;})){toast('已存在');return;}
      CONFIG.accessories=CONFIG.accessories||[];
      CONFIG.accessories.push({name:nm,image:pendingAccImg||''});
      pendingAccImg='';saveCfgAll();toast('已加入 '+nm);return;
    }
    if(t.id==='ac_add'){createAccount();return;}
    if(t.dataset&&t.dataset.roledel!=null){
      var rk=t.dataset.roledel;var rr=ROLES[rk]||{};
      if(USER&&rr.email&&emailKey(USER.email)===emailKey(rr.email)){toast('不能移除自己的授權');return;}
      if(!confirm('取消「'+(rr.name||rr.email||rk)+'」的登入授權？'))return;
      dbRemove(ROOT+'/roles/'+rk);toast('已取消授權');return;
    }
  });
  root.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.gpct!=null){CONFIG.categories[Number(t.dataset.gpct)].pct=num(t.value);saveCfgAll();toast('已更新目標％');return;}
    if(t.id==='acc_img'){var f=t.files[0];if(!f)return;compressImage(f,function(url){pendingAccImg=url;var s=$('acc_state');if(s)s.textContent='已選擇圖片';toast('圖片已壓縮，按「加入」儲存');},400);}
  });
  var dragKey=null,dragIdx=null;
  root.addEventListener('dragstart',function(e){var t=e.target.closest('.tag-x[draggable]');if(!t)return;dragKey=t.dataset.key;dragIdx=Number(t.dataset.idx);});
  root.addEventListener('dragover',function(e){if(dragKey!=null)e.preventDefault();});
  root.addEventListener('drop',function(e){
    var t=e.target.closest('.tag-x[draggable]');
    if(!t||dragKey==null)return;
    e.preventDefault();
    if(t.dataset.key===dragKey){
      var to=Number(t.dataset.idx);
      if(to!==dragIdx){var l=getList(dragKey);var moved=l.splice(dragIdx,1)[0];l.splice(to,0,moved);saveCfgAll();toast('已調整順序');}
    }
    dragKey=null;dragIdx=null;
  });
}

function bdFit(){

  var vp=$('bdViewport').getBoundingClientRect();

function bdZoomAt(cx,cy,f){
  var ns=Math.min(4,Math.max(0.1,bdView.s*f));
  bdView.x=cx-(cx-bdView.x)*(ns/bdView.s);

}
function bdComputeSnap(dx,dy){
  var TH=6/bdView.s,res={dx:0,dy:0,guides:[]};
  if(!bdStart.pos)return res;
  var moving=bdStart.pos.map(function(p){return p.id;});
  var l=1e9,t=1e9,r=-1e9,b=-1e9;
  bdStart.pos.forEach(function(p){var o=bdById(p.id);if(!o)return;l=Math.min(l,p.x+dx);t=Math.min(t,p.y+dy);r=Math.max(r,p.x+dx+o.w);b=Math.max(b,p.y+dy+(o.h||40));});
  var cx=(l+r)/2,cy=(t+b)/2,bestX=null,bestY=null;
  Object.keys(bdItems).forEach(function(k){
    if(moving.indexOf(k)>=0)return;
    var o=bdItems[k];
    var ox=[o.x,o.x+o.w/2,o.x+o.w],oy=[o.y,o.y+(o.h||40)/2,o.y+(o.h||40)];
    [l,cx,r].forEach(function(mv){ox.forEach(function(sv){var d=sv-mv;if(Math.abs(d)<TH&&(bestX===null||Math.abs(d)<Math.abs(bestX.d)))bestX={d:d,line:sv};});});
    [t,cy,b].forEach(function(mv){oy.forEach(function(sv){var d=sv-mv;if(Math.abs(d)<TH&&(bestY===null||Math.abs(d)<Math.abs(bestY.d)))bestY={d:d,line:sv};});});
  });
  if(bestX){res.dx=bestX.d;res.guides.push({v:true,at:bestX.line});}
  if(bestY){res.dy=bestY.d;res.guides.push({v:false,at:bestY.line});}
  return res;
}

      bdMode='drag';
      var w=bdToWorld(e.clientX,e.clientY);
      bdStart={wx:w.x,wy:w.y,pos:bdSel.map(function(sid){var o=bdById(sid);return {id:sid,x:o.x,y:o.y};}),moved:false};
      bdUpdateSelUI();e.preventDefault();return;
    }
    var vr=$('bdViewport').getBoundingClientRect();
    if(e.shiftKey){
      bdMode='marquee';bdStart={cx:e.clientX,cy:e.clientY,vr:vr};
      var mq=$('bdMarquee');mq.style.display='block';
      mq.style.left=(e.clientX-vr.left)+'px';mq.style.top=(e.clientY-vr.top)+'px';mq.style.width='0px';mq.style.height='0px';
    }else{
      bdMode='pan';bdStart={cx:e.clientX,cy:e.clientY,vx:bdView.x,vy:bdView.y};
      $('bdViewport').classList.add('panning');
      if(bdSel.length){bdSel=[];bdUpdateSelUI();}
    }
    e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){
    if(bdMode==='pan'){bdView.x=bdStart.vx+(e.clientX-bdStart.cx);bdView.y=bdStart.vy+(e.clientY-bdStart.cy);bdApplyView();}
    else if(bdMode==='drag'){
      var w=bdToWorld(e.clientX,e.clientY);
      var dx=w.x-bdStart.wx,dy=w.y-bdStart.wy;
      if(dx||dy)bdStart.moved=true;
      var snap=bdComputeSnap(dx,dy);
      bdStart.pos.forEach(function(p){var o=bdById(p.id);if(!o)return;o.x=p.x+dx+snap.dx;o.y=p.y+dy+snap.dy;var d=bdEl(p.id);if(d){d.style.left=o.x+'px';d.style.top=o.y+'px';}});
      bdDrawGuides(snap.guides);
    }
    else if(bdMode==='marquee'){
      var mq=$('bdMarquee'),vr=bdStart.vr;
      mq.style.left=(Math.min(bdStart.cx,e.clientX)-vr.left)+'px';
      mq.style.top=(Math.min(bdStart.cy,e.clientY)-vr.top)+'px';
      mq.style.width=Math.abs(e.clientX-bdStart.cx)+'px';
      mq.style.height=Math.abs(e.clientY-bdStart.cy)+'px';
    }
    else if(bdMode==='gresize'){
      var gdx=(e.clientX-bdStart.mx)/bdView.s;
      var gc=bdStart.corner;
      var bw=Math.max(1,bdStart.r-bdStart.l);
      var k=(bw+((gc==='se'||gc==='ne')?gdx:-gdx))/bw;
      k=Math.max(0.08,k);
      var ax=(gc==='se'||gc==='ne')?bdStart.l:bdStart.r;
      var ay=(gc==='se'||gc==='sw')?bdStart.t:bdStart.b;
      Object.keys(bdStart.snap).forEach(function(sid){
        var o=bdById(sid);if(!o)return;var s0=bdStart.snap[sid];
        o.x=ax+(s0.x-ax)*k;o.y=ay+(s0.y-ay)*k;
        o.w=Math.max(20,s0.w*k);
        if(s0.h)o.h=Math.max(20,s0.h*k);
        if(s0.fs)o.fs=Math.max(8,Math.round(s0.fs*k));
        var d=bdEl(sid);
        if(d){d.style.left=o.x+'px';d.style.top=o.y+'px';d.style.width=o.w+'px';if(s0.h&&o.type!=='text')d.style.height=o.h+'px';if(s0.fs)d.style.fontSize=o.fs+'px';}
      });
    }
    else if(bdMode==='resize'){
      var it=bdById(bdStart.id);if(!it)return;
      var rdx=(e.clientX-bdStart.mx)/bdView.s,rdy=(e.clientY-bdStart.my)/bdView.s;
      var c=bdStart.corner||'se';
      if(it.type==='image'||it.type==='swatch'){
        var ratio=bdStart.h/bdStart.w;
        var w=bdStart.w+((c==='se'||c==='ne')?rdx:-rdx);
        w=Math.max(30,w);
        var h=w*ratio;
        it.w=w;it.h=h;
        it.x=(c==='nw'||c==='sw')?bdStart.x+(bdStart.w-w):bdStart.x;
        it.y=(c==='nw'||c==='ne')?bdStart.y+(bdStart.h-h):bdStart.y;
      }else if(it.type==='note'){
        it.w=Math.max(60,bdStart.w+rdx);it.h=Math.max(60,bdStart.h+rdy);
      }else{
        it.w=Math.max(60,bdStart.w+rdx);
      }
      var d=bdEl(bdStart.id);
      if(d){d.style.left=it.x+'px';d.style.top=it.y+'px';d.style.width=it.w+'px';if(it.type!=='text')d.style.height=it.h+'px';}
    }
    if(cropDrag){
      var dx2=e.clientX-cropDrag.mx,dy2=e.clientY-cropDrag.my;
      var x=cropDrag.x,y=cropDrag.y,w2=cropDrag.w,h2=cropDrag.hh;
      if(cropDrag.h==='move'){x+=dx2;y+=dy2;}
      if(cropDrag.h==='nw'){x+=dx2;y+=dy2;w2-=dx2;h2-=dy2;}
      if(cropDrag.h==='ne'){y+=dy2;w2+=dx2;h2-=dy2;}
      if(cropDrag.h==='sw'){x+=dx2;w2-=dx2;h2+=dy2;}
      if(cropDrag.h==='se'){w2+=dx2;h2+=dy2;}
      w2=Math.max(24,w2);h2=Math.max(24,h2);
      x=Math.max(0,Math.min(cropDrag.sw-w2,x));y=Math.max(0,Math.min(cropDrag.sh-h2,y));
      var r2=$('cropRect');
      r2.style.left=x+'px';r2.style.top=y+'px';r2.style.width=w2+'px';r2.style.height=h2+'px';
    }
  });
  window.addEventListener('mouseup',function(e){
    if(bdMode==='marquee'){
      var mq=$('bdMarquee');mq.style.display='none';
      var a=bdToWorld(Math.min(bdStart.cx,e.clientX),Math.min(bdStart.cy,e.clientY));
      var b=bdToWorld(Math.max(bdStart.cx,e.clientX),Math.max(bdStart.cy,e.clientY));
      bdSel=Object.keys(bdItems).filter(function(k){var it=bdItems[k];return it.x<b.x&&it.x+it.w>a.x&&it.y<b.y&&it.y+(it.h||40)>a.y;});
      bdUpdateSelUI();
    }
    if(bdMode==='drag'&&bdStart.moved)bdWriteMany(bdSel);
    if(bdMode==='resize')bdWrite(bdStart.id);
    if(bdMode==='gresize')bdWriteMany(Object.keys(bdStart.snap));
    if(bdMode==='drag'||bdMode==='resize')bdClearGuides();
    if(bdMode){$('bdViewport').classList.remove('panning');bdMode=null;if(bdDirty){bdDirty=false;renderBoardSafe();}}
    cropDrag=null;
  });
  $('bdViewport').addEventListener('dblclick',function(e){
    var t=e.target.closest('.bd-item');if(!t)return;
    var id=t.dataset.id,it=bdById(id);if(!it)return;
    if(it.type==='swatch'){
      var inp=document.createElement('input');inp.type='color';inp.value=it.color||'#ED7D31';
      inp.addEventListener('input',function(){it.color=inp.value;var d=bdEl(id);if(d)d.style.background=inp.value;});
      inp.addEventListener('change',function(){bdWrite(id);});
      inp.click();return;
    }
    if(it.type!=='text'&&it.type!=='note')return;
    var box=t.querySelector('.txt');
    box.contentEditable='true';box.classList.add('bd-editing');box.focus();
    document.execCommand('selectAll',false,null);
    bdEditing=id;
    bdShowTextTools(t);
    box.addEventListener('blur',function h(e2){
      if(e2&&e2.relatedTarget&&$('bdTextTools').contains(e2.relatedTarget)){setTimeout(function(){box.focus();},0);return;}
      box.contentEditable='false';box.classList.remove('bd-editing');
      it.html=cleanHtml(box.innerHTML);
      it.text=box.innerText;
      bdEditing=null;
      $('bdTextTools').hidden=true;
      bdWrite(id);
      box.removeEventListener('blur',h);
      if(bdDirty){bdDirty=false;renderBoardSafe();}
    });
  });
  window.addEventListener('keydown',function(e){
    if(currentTab!=='board'||bdEditing)return;
    if(document.activeElement&&['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName)>=0)return;
    if((e.key==='Delete'||e.key==='Backspace')&&bdSel.length){bdDelSel();e.preventDefault();return;}
    var st=e.shiftKey?10:2;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key)>=0&&bdSel.length){
      bdSelItems().forEach(function(i){
        if(e.key==='ArrowLeft')i.x-=st;if(e.key==='ArrowRight')i.x+=st;
        if(e.key==='ArrowUp')i.y-=st;if(e.key==='ArrowDown')i.y+=st;
      });
      bdSel.forEach(function(id){var i=bdById(id);var d=bdEl(id);if(d){d.style.left=i.x+'px';d.style.top=i.y+'px';}});
      clearTimeout(bdNudgeTm);bdNudgeTm=setTimeout(function(){bdWriteMany(bdSel);},500);
      e.preventDefault();
    }
  });
  $('btnCrop').addEventListener('click',function(){
    var id=bdSel.length===1?bdSel[0]:null;
    var it=id?bdById(id):null;
    if(!it||it.type!=='image')return;
    cropTarget=id;
    var img=new Image();
    img.onload=function(){
      var maxW=window.innerWidth*0.62,maxH=window.innerHeight*0.62;
      var s=Math.min(maxW/img.width,maxH/img.height,1);
      var st=$('cropStage');
      st.style.width=Math.round(img.width*s)+'px';st.style.height=Math.round(img.height*s)+'px';
      $('cropImg').src=it.src;
      var r=$('cropRect');
      r.style.left='8%';r.style.top='8%';r.style.width='84%';r.style.height='84%';
      $('cropOverlay').style.display='flex';
    };
    img.src=it.src;
  });
  $('cropRect').addEventListener('mousedown',function(e){
    var h=e.target.dataset&&e.target.dataset.h;
    var st=$('cropStage').getBoundingClientRect(),r=$('cropRect').getBoundingClientRect();
    cropDrag={h:h||'move',mx:e.clientX,my:e.clientY,x:r.left-st.left,y:r.top-st.top,w:r.width,hh:r.height,sw:st.width,sh:st.height};
    e.preventDefault();e.stopPropagation();
  });
  $('cropCancel').addEventListener('click',function(){$('cropOverlay').style.display='none';cropTarget=null;});
  $('cropOk').addEventListener('click',function(){
    var it=cropTarget?bdById(cropTarget):null;
    if(!it){$('cropOverlay').style.display='none';return;}
    var st=$('cropStage').getBoundingClientRect(),r=$('cropRect').getBoundingClientRect();
    var img=new Image();
    img.onload=function(){
      var kx=img.width/st.width,ky=img.height/st.height;
      var sx=(r.left-st.left)*kx,sy=(r.top-st.top)*ky,sw=r.width*kx,sh=r.height*ky;
      var cv=document.createElement('canvas');cv.width=Math.round(sw);cv.height=Math.round(sh);
      cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
      it.src=cv.toDataURL('image/jpeg',0.88);
      it.h=it.w*(sh/sw);
      bdWrite(cropTarget);
      $('cropOverlay').style.display='none';cropTarget=null;
      renderBoard();toast('裁切完成');
    };
    img.src=it.src;
  });
}

/* ---------- 廠商版下單單 ---------- */
var sheetItem=null;
function openSheet(id){var it=ITEMS[id];if(!it)return;openSheetFromData(it);}
function openSheetFromData(it){
  sheetItem=it;
  var p=PERIODS[it.periodId]||{};
  var h='<div class="sh-title">台灣群秀下單明細</div>';
  h+='<div class="sh-sub">'+esc((p.month||'')+'｜'+(p.name||''))+'　產單日 '+new Date().toLocaleDateString('zh-TW')+'</div>';
  h+='<table class="sh-tbl"><tr>'+
    '<td class="lbl">款號</td><td style="font-weight:800;font-size:15px">'+esc(it.styleNo||'')+'</td>'+
    '<td class="lbl">款別</td><td>'+esc(it.styleType||'')+'</td>'+
    '<td class="lbl">品類</td><td>'+esc(it.category||'')+'</td>'+
    '<td class="lbl">廠商</td><td>'+esc(it.vendor||'')+'</td></tr>'+
    '<tr>'+
    '<td style="background:#FF2D2D;color:#111;font-weight:900;font-size:15px;border:2px solid #111;white-space:nowrap">交大貨日期</td>'+
    '<td style="background:#FF2D2D;color:#111;font-weight:900;font-size:16px;border:2px solid #111">'+esc(it.deliveryDate||'—')+'</td>'+
    '<td style="background:#FFF200;color:#111;font-weight:900;font-size:15px;border:2px solid #111;white-space:nowrap">交拍樣日期</td>'+
    '<td style="background:#FFF200;color:#111;font-weight:900;font-size:16px;border:2px solid #111">'+esc(it.sampleDate||'—')+'</td>'+
    '<td style="background:#FFA51F;color:#111;font-weight:900;font-size:15px;border:2px solid #111;white-space:nowrap">做貨天數</td>'+
    '<td style="background:#FFA51F;color:#111;font-weight:900;font-size:16px;border:2px solid #111" colspan="3">'+esc(it.prodDays||'—')+'</td></tr>'+
    '<tr><td class="lbl">下單日期</td><td>'+esc(it.orderDate||'')+'</td>'+
    '<td class="lbl">預計上架日</td><td>'+esc(it.onShelf||'')+'</td>'+
    '<td class="lbl">價格</td><td>'+(it.price||'')+'</td>'+
    '<td class="lbl">MOQ</td><td>'+(it.moq||'')+'</td></tr>'+
    '<tr><td class="lbl">貨運行</td><td>'+esc(it.freight||'')+'</td>'+
    '<td class="lbl">運輸方式</td><td>'+esc(it.ship||'')+'</td>'+
    '<td class="lbl">付款方式</td><td>'+esc(it.pay||'')+'</td>'+
    '<td class="lbl">輔料</td><td>'+esc(it.accessory||'')+'</td></tr>'+
    '<tr><td class="lbl">領標</td><td colspan="3">'+esc(it.labelNote||'')+'</td>'+
    '<td class="lbl">吊牌</td><td colspan="3">'+esc(it.tag||'')+'</td></tr></table>';

  h+='<div class="sh-2col">';
  var imgs=arr(it.images).map(imgSrc).filter(Boolean);if(!imgs.length&&imgSrc(it.image))imgs=[imgSrc(it.image)];
  var cimgs=arr(it.colorImages).map(imgSrc).filter(Boolean);
  h+='<div>';
  h+='<div class="sh-imgbox">'+(imgs.length?imgs.map(function(u){return '<img src="'+u+'">';}).join(''):'<span style="color:var(--muted);font-size:12px">無款式圖片</span>')+'</div>';
  if(cimgs.length){h+='<div style="font-size:12px;font-weight:800;color:var(--blue-dark);margin:8px 0 4px">色卡</div><div class="sh-imgbox" style="min-height:0">'+cimgs.map(function(u){return '<img src="'+u+'">';}).join('')+'</div>';}
  h+='</div>';
  h+='<div class="sh-notes"><div class="nt">備註</div>'+(cleanHtml(it.notes)||'<span style="color:var(--muted)">—</span>')+'</div>';
  h+='</div>';
  var meas=arr(it.measurements).filter(function(m){return String(m.value==null?'':m.value).trim()!=='';});
  if(meas.length){
    h+='<table class="sh-tbl" style="max-width:420px"><tr><th colspan="2">訂貨尺寸（cm）</th></tr>';
    meas.forEach(function(m){h+='<tr><td class="lbl">'+esc(m.name||'')+'</td><td>'+esc(m.value||'')+'</td></tr>';});
    h+='</table>';
  }
  var rows=arr(it.rows);var tq=0;
  h+='<table class="sh-tbl" style="max-width:420px"><tr><th>顏色</th><th>尺寸</th><th>數量</th></tr>';
  rows.forEach(function(r){tq+=num(r.orderQty);h+='<tr><td>'+esc(r.color||'')+'</td><td>'+esc(r.size||'')+'</td><td style="font-weight:700">'+fmt(num(r.orderQty))+'</td></tr>';});
  h+='<tr><td class="lbl" colspan="2">合計</td><td style="font-weight:800">'+fmt(tq)+'</td></tr></table>';
  h+='<div class="sh-foot">※ 大貨可接受的尺寸誤差須小於 ±2cm<br>※ 棉麻需先水洗防縮水處理後才可交貨<br>※ 出貨時間若有變動請提前 3 日以上通知</div>';
  $('sheetBody').innerHTML=h;
  $('sheetModal').hidden=false;
}
function wireSheet(){
  $('sheetClose').addEventListener('click',function(){$('sheetModal').hidden=true;});
  $('sheetModal').addEventListener('click',function(e){if(e.target===this)this.hidden=true;});
  $('sheetPrint').addEventListener('click',function(){window.print();});
  $('sheetJpg').addEventListener('click',function(){
    if(typeof html2canvas==='undefined'){toast('圖片元件載入失敗，請檢查網路後重新整理');return;}
    var it=sheetItem||{};
    toast('產生圖片中…');
    html2canvas($('sheetBody'),{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(function(cv){
      var a=document.createElement('a');
      a.href=cv.toDataURL('image/jpeg',0.92);
      a.download='下單單_'+(it.styleNo||'item')+'.jpg';
      document.body.appendChild(a);a.click();a.remove();
      toast('已下載 JPG，可直接傳給廠商');
    });
  });
}

/* ---------- Excel 匯出 ---------- */
function exportExcel(){
  if(!isAdmin()){toast('僅主管可匯出');return;}
  if(typeof XLSX==='undefined'){toast('Excel 元件載入失敗，請檢查網路後重新整理');return;}
  var pids=ovPeriod==='all'?periodsOfMonth(ovMonth):[ovPeriod];
  var ids=itemsOfPeriods(pids);
  if(!ids.length){toast('目前範圍沒有款式資料');return;}
  var scopeName=ovMonth+(ovPeriod==='all'?'_整月':'_'+(((PERIODS[ovPeriod]||{}).name)||'檔期'));

  var s1=[['檔期','上架日','檔期目標','款數','下單件數','達成率','下單金額','已配件數','官網件數','門市件數','官網佔比']];
  pids.forEach(function(pid){
    var p=PERIODS[pid];var pi=itemsOfPeriods([pid]);
    var oq=0,aq=0,amt=0,wq=0;
    pi.forEach(function(id){var it=ITEMS[id];var pr=num(it.price);arr(it.rows).forEach(function(r){var o=num(r.orderQty);oq+=o;aq+=rowAllocCfg(r);amt+=o*pr;wq+=num(r.web);});});
    s1.push([p.name||'',p.date||'',num(p.target)||'',pi.length,oq,(num(p.target)>0?Math.round(oq/num(p.target)*100)+'%':''),Math.round(amt),aq,wq,aq-wq,(aq>0?Math.round(wq/aq*100)+'%':'')]);
  });

  var s2=[['檔期','款號','款別','品類','大類','廠商','單價','訂購件數','已配件數','留倉件數','下單金額','下單日期','交拍樣日期','交大貨日期','做貨天數','預計上架日','貨運行','運輸方式','付款方式','MOQ','輔料','領標','吊牌']];
  ids.forEach(function(id){
    var it=ITEMS[id];var p=PERIODS[it.periodId]||{};
    var ot=itemOrderTotal(it),at=itemAllocTotalCfg(it);
    s2.push([p.name||'',it.styleNo||'',it.styleType||'',it.category||'',it.categoryGroup||'',it.vendor||'',num(it.price),ot,at,ot-at,Math.round(ot*num(it.price)),it.orderDate||'',it.sampleDate||'',it.deliveryDate||'',it.prodDays||'',it.onShelf||'',it.freight||'',it.ship||'',it.pay||'',num(it.moq)||'',it.accessory||'',it.labelNote||'',it.tag||'']);
  });

  var h3=['檔期','款號','顏色','尺寸','訂購數'].concat(CONFIG.stores).concat(['官網','已配','留倉']);
  var s3=[h3];
  ids.forEach(function(id){
    var it=ITEMS[id];var p=PERIODS[it.periodId]||{};
    arr(it.rows).forEach(function(r){
      var row=[p.name||'',it.styleNo||'',r.color||'',r.size||'',num(r.orderQty)];
      CONFIG.stores.forEach(function(s){row.push(num(r.alloc&&r.alloc[s]));});
      var ra=rowAllocCfg(r);
      row.push(num(r.web),ra,num(r.orderQty)-ra);
      s3.push(row);
    });
  });

  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s1),'檔期摘要');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s2),'款式清單');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s3),'配貨明細');
  XLSX.writeFile(wb,'採購配貨_'+scopeName+'.xlsx');
  toast('已匯出 Excel');
}

wireSheet();
init();
</script>
