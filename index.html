<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VV DOUBLE 採購配貨中心</title>
<style>
:root{
  --blue:#4472C4; --blue-dark:#2F5597; --blue-light:#EDF1F8;
  --orange:#ED7D31; --orange-light:#FDF0E5;
  --bg:#DEE5F2; --card:#FFFFFF; --ink:#33415C; --muted:#7A869C;
  --line:#D5DCEA; --ok:#3E8E5A; --danger:#C0392B;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{position:sticky;top:0;z-index:50;background:var(--card);box-shadow:0 1px 4px rgba(51,65,92,.12)}
.hin{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hbrand{font-size:17px;font-weight:800;letter-spacing:1px;color:var(--ink)}
.hbrand span{color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(51,65,92,.08);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}}
.stat{background:var(--blue-light);border-radius:10px;padding:12px 14px}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .num{font-size:26px;font-weight:800;color:var(--ink);line-height:1.3}
.stat .num.hl{color:var(--orange)}
.stat .note{font-size:12px;color:var(--muted)}
.bar-track{background:#E4EAF4;border-radius:6px;height:14px;overflow:hidden;position:relative}
.bar-fill{background:var(--blue);height:100%;border-radius:6px;min-width:2px;transition:width .3s}
.bar-fill.orange{background:var(--orange)}
.bar-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin-bottom:8px}
.bar-row .bl{font-size:13px;display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right}
.bar-row .bv{font-size:13px;font-weight:700;white-space:nowrap}
.bar-row .bv small{color:var(--muted);font-weight:400}
.swatch{width:14px;height:14px;border-radius:4px;border:1px solid rgba(51,65,92,.25);display:inline-block;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn{border:none;border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn-warn{background:var(--orange);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.tbl{border-collapse:collapse;width:100%;background:#fff}
.tbl th{background:var(--blue);color:#fff;padding:7px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center;font-size:13px}
.tbl tfoot td{background:var(--blue-light);font-weight:700}
.tbl input,.tbl select{width:100%;min-width:44px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;font-size:13px;text-align:center;font-family:inherit;background:#fff}
.tbl input:focus,.tbl select:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.tscroll{overflow-x:auto}
.diff-warn{color:var(--orange);font-weight:800}
.diff-ok{color:var(--ok);font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.fld textarea{resize:vertical;min-height:64px}
.imgbox{border:2px dashed var(--line);border-radius:10px;min-height:140px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:var(--blue-light)}
.imgbox img{max-width:100%;max-height:220px;display:block}
.imgbox .ph{color:var(--muted);font-size:13px;text-align:center;padding:20px}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.item-card .thumb{height:150px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;overflow:hidden}
.item-card .thumb img{width:100%;height:100%;object-fit:cover}
.item-card .thumb .noimg{color:var(--muted);font-size:12px}
.item-card .ib{padding:10px 12px;flex:1}
.item-card .sn{font-weight:800;font-size:15px}
.item-card .meta{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.item-card .foot{display:flex;gap:6px;padding:0 12px 10px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700}
.badge-blue{background:var(--blue-light);color:var(--blue-dark)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.tag-x{display:inline-flex;align-items:center;gap:6px;background:var(--blue-light);border-radius:14px;padding:4px 8px 4px 12px;font-size:13px;margin:3px}
.tag-x b{cursor:pointer;color:var(--muted);font-weight:700}
.tag-x b:hover{color:var(--danger)}
.inline-add{display:flex;gap:6px;margin-top:8px}
.inline-add input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;width:130px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
#toast.show{opacity:1}
#login{position:fixed;inset:0;background:var(--bg);z-index:150;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:14px;padding:32px;width:320px;box-shadow:0 4px 20px rgba(51,65,92,.15);text-align:center}
.login-box h2{margin:0 0 6px;font-size:18px}
.login-box p{color:var(--muted);font-size:13px;margin:0 0 16px}
.login-box input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;text-align:center;margin-bottom:12px;font-family:inherit}
.demo-banner{background:var(--orange);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:5px}
.sec-title{font-size:13px;font-weight:800;color:var(--blue-dark);margin:14px 0 8px;border-left:4px solid var(--blue);padding-left:8px}
.hint{font-size:12px;color:var(--muted)}
.month-card .mth{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.month-card .mth .mname{font-size:17px;font-weight:800}
.pd-row{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;align-items:center}
.pd-row .pn{font-weight:800}
.pd-row .pm{font-size:12px;color:var(--muted);line-height:1.7}
.mini-input{width:90px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;text-align:center;font-family:inherit}
a{color:var(--blue)}
.rt-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:6px 8px;background:var(--blue-light)}
.rt-bar button{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:28px;height:26px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink);padding:0 6px}
.rt-bar button:hover{border-color:var(--blue)}
.rt-bar select{width:auto;min-width:0;border:1px solid var(--line);border-radius:6px;height:26px;font-size:12px;font-family:inherit;background:#fff;padding:0 4px}
.rt-bar .rt-dot{width:20px;height:20px;min-width:20px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.rt-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rt-area{border:1px solid var(--line);border-radius:0 0 8px 8px;min-height:130px;padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);line-height:1.7;outline:none}
.rt-area:focus{border-color:var(--blue);outline:2px solid var(--blue)}
.rt-area:empty::before{content:'例：請依照樣板做貨，尺寸表確認後才能做貨…';color:var(--muted)}
#sheetModal{position:fixed;inset:0;background:rgba(51,65,92,.55);z-index:120;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px}
.sheet-panel{background:#F2F5FA;border-radius:12px;max-width:900px;width:100%;padding:14px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
#sheetBody{background:#fff;padding:28px;border:1px solid var(--line)}
.sh-title{font-size:20px;font-weight:800;color:var(--ink);text-align:center;margin-bottom:4px;letter-spacing:2px}
.sh-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
.sh-tbl{border-collapse:collapse;width:100%;margin-bottom:14px}
.sh-tbl th{background:var(--blue);color:#fff;font-size:12px;padding:6px 8px;border:1px solid var(--blue-dark);white-space:nowrap}
.sh-tbl td{border:1px solid #B9C4DA;padding:6px 8px;font-size:13px;text-align:center;color:var(--ink)}
.sh-tbl td.lbl{background:var(--blue-light);font-weight:700;font-size:12px;white-space:nowrap}
.sh-2col{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-bottom:14px}
.sh-imgbox{border:1px solid #B9C4DA;min-height:220px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#FAFBFD;padding:6px}
.sh-imgbox img{max-width:100%;max-height:260px}
.sh-notes{border:1px solid #B9C4DA;padding:10px 12px;font-size:13px;line-height:1.8;min-height:220px}
.sh-notes .nt{font-size:12px;font-weight:800;color:var(--blue-dark);margin-bottom:6px}
.sh-key{border-collapse:collapse;margin:0 0 14px;width:100%;max-width:440px}
.sh-key td{border:2px solid #111;padding:8px 14px;font-size:19px;font-weight:900;color:#111;text-align:center;letter-spacing:1px}
.sh-key td.k{width:46%}
.sh-foot{margin-top:12px;font-size:12px;color:var(--ink);line-height:1.9;border-top:2px solid var(--blue);padding-top:8px}
@media print{
  body>*{display:none !important}
  #sheetModal{display:flex !important;position:static;background:#fff;padding:0}
  .sheet-panel{max-width:none;padding:0;background:#fff}
  .sheet-actions{display:none !important}
  #sheetBody{border:none}
}
#hoverPreview{position:fixed;z-index:170;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 32px rgba(51,65,92,.35);padding:6px}
#hoverPreview img{max-width:360px;max-height:440px;display:block;border-radius:6px}
#lightbox{position:fixed;inset:0;background:rgba(20,26,40,.85);z-index:180;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
#lightbox img{max-width:94vw;max-height:92vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);background:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb-tile{position:relative;width:86px;height:104px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--blue-light)}
.thumb-tile img{width:100%;height:100%;object-fit:cover}
.thumb-tile b{position:absolute;top:2px;right:2px;background:rgba(51,65,92,.78);color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:11px;cursor:pointer}
.thumb-add{width:86px;height:104px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;cursor:pointer;background:var(--blue-light)}
.tag-hidden{display:inline-flex;align-items:center;gap:6px;background:#EDEFF3;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:4px 8px 4px 12px;font-size:13px;margin:3px;cursor:pointer}
.tag-hidden b{cursor:pointer;font-weight:700}
.tag-hidden b:hover{color:var(--danger)}
.tag-x{cursor:grab}
.tag-x img{vertical-align:middle}
.tagzone{min-height:34px}
hidden,[hidden]{display:none !important}
</style>
</head>
<body>
<div id="demoBanner" class="demo-banner" hidden>示範模式：資料只存在本頁，不會寫入資料庫（網址去掉 ?demo 即為正式版）</div>
<header>
  <div class="hin">
    <div class="hbrand">VV <span>DOUBLE</span>｜採購配貨中心</div>
    <button class="tab" id="backBtn" hidden>&larr; 回上一頁</button>
    <nav class="tabs">
      <button class="tab active" data-tab="overview">總覽</button>
      <button class="tab" data-tab="form">下單卡</button>
      <button class="tab" data-tab="list">款式列表</button>
      <button class="tab" data-tab="periods">檔期管理</button>
      <button class="tab" data-tab="settings">設定</button>
    </nav>
    <div id="userBox" class="hint" style="margin-left:auto;display:flex;align-items:center;gap:8px" hidden><span id="userEmail"></span><button class="btn btn-ghost btn-sm" id="logoutBtn">登出</button></div>
  </div>
</header>
<main class="wrap">
  <section id="page-overview"></section>

  <section id="page-form" hidden>
    <div class="card">
      <h3 id="formTitle">新增下單卡 <span class="sub">採購每下一款填一張，儲存後自動彙總到總覽</span></h3>
      <div class="sec-title">基本資訊</div>
      <div class="form-grid">
        <div class="fld"><label>檔期 *</label><select id="f_period"></select></div>
        <div class="fld"><label>款號 *</label><input id="f_styleNo" placeholder="例：TW1001"></div>
        <div class="fld"><label>款別</label><select id="f_styleType"></select></div>
        <div class="fld"><label>品類 *</label><select id="f_category"></select></div>
        <div class="fld"><label>廠商名稱</label><select id="f_vendor"></select></div>
        <div class="fld"><label>下單日期</label><input id="f_orderDate" type="date"></div>
        <div class="fld"><label>交大貨日期</label><input id="f_deliveryDate" type="date"></div>
        <div class="fld"><label>交拍樣日期</label><input id="f_sampleDate" type="date"></div>
        <div class="fld"><label>做貨天數</label><input id="f_prodDays" placeholder="例：5-6天"></div>
        <div class="fld"><label>預計上架日</label><select id="f_onShelfSel"></select><input id="f_onShelf" type="date" style="margin-top:6px" hidden></div>
        <div class="fld"><label>貨運行</label><select id="f_freight"></select></div>
        <div class="fld"><label>運輸方式</label><input id="f_ship" list="shipList" placeholder="例：海運"><datalist id="shipList"><option value="海運"><option value="空運"><option value="快遞"></datalist></div>
        <div class="fld"><label>付款方式</label><input id="f_pay" value="貨運行轉匯"></div>
        <div class="fld"><label>價格</label><input id="f_price" type="number" min="0" placeholder="單價"></div>
        <div class="fld"><label>輔料</label><select id="f_accessory"></select><div id="accPreview" style="margin-top:6px" hidden><img id="accPreviewImg" style="max-height:56px;border:1px solid var(--line);border-radius:6px"></div></div>
        <div class="fld"><label>MOQ</label><input id="f_moq" type="number" min="0" placeholder="例：50"></div>
        <div class="fld"><label>領標</label><select id="f_label"></select></div>
        <div class="fld"><label>吊牌</label><select id="f_tag"></select></div>
      </div>
      <div class="form-grid" style="margin-top:12px;grid-template-columns:1fr 1fr 2fr">
        <div class="fld">
          <label>款式圖片（可多張，自動壓縮）</label>
          <div class="thumbs" id="imgThumbs"></div>
          <input id="f_image" type="file" accept="image/*" multiple hidden>
        </div>
        <div class="fld">
          <label>色卡圖（可多張，自動壓縮）</label>
          <div class="thumbs" id="colorThumbs"></div>
          <input id="f_colorImage" type="file" accept="image/*" multiple hidden>
        </div>
        <div class="fld"><label>備註</label>
          <div class="rt-bar">
            <button type="button" data-cmd="bold" title="粗體"><b>B</b></button>
            <button type="button" data-cmd="italic" title="斜體"><i>I</i></button>
            <button type="button" data-cmd="underline" title="底線"><u>U</u></button>
            <span class="rt-sep"></span>
            <select id="rt_size" title="文字大小"><option value="">字級</option><option value="2">小</option><option value="3">標準</option><option value="5">大</option><option value="6">特大</option></select>
            <span class="rt-sep"></span>
            <button type="button" class="rt-dot" data-color="#33415C" style="background:#33415C" title="深板岩"></button>
            <button type="button" class="rt-dot" data-color="#4472C4" style="background:#4472C4" title="藍"></button>
            <button type="button" class="rt-dot" data-color="#ED7D31" style="background:#ED7D31" title="橘"></button>
            <button type="button" class="rt-dot" data-color="#C0392B" style="background:#C0392B" title="紅"></button>
            <button type="button" class="rt-dot" data-color="#3E8E5A" style="background:#3E8E5A" title="綠"></button>
            <span class="rt-sep"></span>
            <button type="button" id="rt_clear" title="清除格式">清除格式</button>
          </div>
          <div id="f_notes" class="rt-area" contenteditable="true"></div>
        </div>
      </div>

      <div class="sec-title">訂貨尺寸</div>
      <div class="tscroll"><table class="tbl" style="max-width:520px">
        <thead><tr><th style="width:40%">項目</th><th>尺寸(cm)</th><th style="width:50px"></th></tr></thead>
        <tbody id="measBody"></tbody>
      </table></div>
      <button class="btn btn-ghost btn-sm" id="measAdd" style="margin-top:8px">＋ 加一列</button>

      <div class="sec-title">訂貨明細 × 配貨量（顏色 / 尺寸 × 各店＋官網）</div>
      <p class="hint">「訂購數」＝跟廠商下單的數量；右邊填各店與官網配貨。差異欄＝訂購數 − 已配數（正數表示還有備貨留倉，負數表示配超過）。</p>
      <div class="tscroll"><table class="tbl" id="detailTbl">
        <thead id="detailHead"></thead>
        <tbody id="detailBody"></tbody>
        <tfoot id="detailFoot"></tfoot>
      </table></div>
      <button class="btn btn-ghost btn-sm" id="rowAdd" style="margin-top:8px">＋ 加一列（顏色/尺寸）</button>

      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" id="saveItem">儲存下單卡</button>
        <button class="btn btn-ghost" id="formSheet">預覽 / 匯出下單單</button>
        <button class="btn btn-ghost" id="cancelEdit">取消 / 清空</button>
      </div>
    </div>
  </section>

  <section id="page-list" hidden></section>
  <section id="page-periods" hidden></section>
  <section id="page-settings" hidden></section>
</main>

<div id="login" hidden>
  <div class="login-box">
    <h2>VV DOUBLE 採購配貨中心</h2>
    <p>請用 Email 登入</p>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="loginPw" type="password" placeholder="密碼" autocomplete="current-password">
    <button class="btn btn-primary" id="loginBtn" style="width:100%">登入</button>
    <p id="loginErr" style="color:var(--danger);margin-top:10px" hidden></p>

/* ---------- 資料層（Firebase / 示範模式共用） ---------- */
var MOCK={}, mockListeners=[], mockKey=1;
function pGet(obj,path){var parts=path.split('/').filter(Boolean),cur=obj;for(var i=0;i<parts.length;i++){if(cur==null)return null;cur=cur[parts[i]];}return cur==null?null:cur;}
function pSet(obj,path,val){var parts=path.split('/').filter(Boolean),cur=obj;for(var i=0;i<parts.length-1;i++){if(cur[parts[i]]==null||typeof cur[parts[i]]!=='object')cur[parts[i]]={};cur=cur[parts[i]];}if(val===null)delete cur[parts[parts.length-1]];else cur[parts[parts.length-1]]=val;}
function mockFire(){mockListeners.forEach(function(l){l.cb(pGet(MOCK,l.path));});}
function dbOn(path,cb){if(DEMO){mockListeners.push({path:path,cb:cb});cb(pGet(MOCK,path));}else{db.ref(path).on('value',function(s){cb(s.val());});}}
function dbSet(path,val){if(DEMO){pSet(MOCK,path,JSON.parse(JSON.stringify(val)));mockFire();}else{db.ref(path).set(val);}}
function dbUpdate(path,val){if(DEMO){Object.keys(val).forEach(function(k){pSet(MOCK,path+'/'+k,val[k]);});mockFire();}else{db.ref(path).update(val);}}
function dbPush(path,val){var k;if(DEMO){k='demo'+(mockKey++);pSet(MOCK,path+'/'+k,JSON.parse(JSON.stringify(val)));mockFire();}else{k=db.ref(path).push(val).key;}return k;}
function dbRemove(path){if(DEMO){pSet(MOCK,path,null);mockFire();}else{db.ref(path).remove();}}

function normalizeConfig(v){
  var c=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  ['stores','baseColors','accentColors','sizes','styleTypes','vendors','freights','labelTypes','tagTypes'].forEach(function(k){if(v[k])c[k]=arr(v[k]).map(String);});
  if(v.categories)c.categories=arr(v.categories).map(function(g){return {name:g.name||'',pct:num(g.pct),items:arr(g.items||[]).map(String)};});
  if(v.accessories)c.accessories=arr(v.accessories).map(function(a){return (a&&typeof a==='object')?{name:a.name||'',image:a.image||''}:{name:String(a),image:''};});
  c.hidden={};
  if(v.hidden){Object.keys(v.hidden).forEach(function(k){
    c.hidden[k]=arr(v.hidden[k]).map(function(x){
      if(k==='accessories')return (x&&typeof x==='object')?{name:x.name||'',image:x.image||''}:{name:String(x),image:''};
      return String((x&&typeof x==='object')?x.name:x);
    });
  });}
  if(v.password)c.password=v.password;
  return c;
}

}

var tabHistory=[];
function switchTab(t,noPush){
  if(!noPush&&t!==currentTab){tabHistory.push(currentTab);if(tabHistory.length>20)tabHistory.shift();}
  currentTab=t;
  document.querySelectorAll('.tab').forEach(function(b){if(b.dataset.tab)b.classList.toggle('active',b.dataset.tab===t);});
  ['overview','form','list','periods','settings'].forEach(function(p){$('page-'+p).hidden=(p!==t);});
  $('backBtn').hidden=tabHistory.length===0;
  refresh();
}
function goBack(){var prev=tabHistory.pop();if(prev!=null)switchTab(prev,true);$('backBtn').hidden=tabHistory.length===0;}
function refresh(){
  if(!CONFIG)return;
  if(currentTab==='overview')renderOverview();
  else if(currentTab==='list')renderList();
  else if(currentTab==='periods')renderPeriods();
  else if(currentTab==='settings')renderSettings();
}

function fillSimpleSelects(){
  [['f_styleType','styleTypes'],['f_vendor','vendors'],['f_freight','freights'],['f_label','labelTypes'],['f_tag','tagTypes']].forEach(function(p){
    var el2=$(p[0]);if(!el2)return;var cur=el2.value;
    var h='<option value="">—</option>';
    (CONFIG[p[1]]||[]).forEach(function(v){h+='<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>';});
    if(cur&&(CONFIG[p[1]]||[]).indexOf(cur)<0)h+='<option selected>'+esc(cur)+'</option>';
    el2.innerHTML=h;
  });
  var acc=$('f_accessory');if(acc){
    var curA=acc.value,hA='<option value="">—</option>',found=false;
    (CONFIG.accessories||[]).forEach(function(a){if(a.name===curA)found=true;hA+='<option'+(a.name===curA?' selected':'')+'>'+esc(a.name)+'</option>';});
    if(curA&&!found)hA+='<option selected>'+esc(curA)+'</option>';
    acc.innerHTML=hA;updateAccPreview();
  }
  fillOnShelfSelect();
}

function fillOnShelfSelect(){
  var sel=$('f_onShelfSel');if(!sel)return;

  monthList().forEach(function(m){periodsOfMonth(m).forEach(function(pid){var p=PERIODS[pid];if(p.date&&dates.indexOf(p.date)<0)dates.push(p.date);});});
  var h='<option value="">— 選擇上架日 —</option>';
  dates.forEach(function(d){h+='<option value="'+d+'"'+(d===cur?' selected':'')+'>'+d+'（檔期日）</option>';});
  h+='<option value="__other"'+(cur&&dates.indexOf(cur)<0?' selected':'')+'>其他（自訂日期）</option>';
  sel.innerHTML=h;

}

function compressImage(file,cb,maxSide){
  var img=new Image();
  img.onload=function(){
    var max=maxSide||900,w=img.width,h=img.height;
    if(w>=h&&w>max){h=h*max/w;w=max;}else if(h>w&&h>max){w=w*max/h;h=max;}
    var cv=document.createElement('canvas');cv.width=Math.round(w);cv.height=Math.round(h);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    var q=0.8,url=cv.toDataURL('image/jpeg',q);
    while(url.length>260000&&q>0.3){q-=0.12;url=cv.toDataURL('image/jpeg',q);}
    cb(url);
  };
  img.src=URL.createObjectURL(file);
}

function moveHoverPreview(e){
  var hp=$('hoverPreview');if(hp.hidden)return;
  var x=e.clientX+18,y=e.clientY+12;
  var r=hp.getBoundingClientRect();
  if(x+r.width>window.innerWidth-8)x=e.clientX-r.width-18;
  if(y+r.height>window.innerHeight-8)y=Math.max(8,window.innerHeight-r.height-8);
  if(x<8)x=8;
  hp.style.left=x+'px';hp.style.top=y+'px';
}

        (isAdmin()?'<div style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-ghost btn-sm" data-pedit="'+pid+'">編輯</button><button class="btn btn-ghost btn-sm" data-pdel="'+pid+'" style="color:var(--danger)">刪除</button></div>':'')+'</div>';

    else{data.createdAt=Date.now();dbPush(ROOT+'/periods',data);toast('已建立檔期：'+n);}

    if(confirm('刪除檔期「'+(PERIODS[pid].name||'')+'」？')){dbRemove(ROOT+'/periods/'+pid);toast('已刪除');}

  el.querySelectorAll('[data-pedit]').forEach(function(b){b.addEventListener('click',function(){editPeriodId=b.dataset.pedit;renderPeriods();window.scrollTo(0,0);});});
}

function createAccount(){
  if(DEMO){toast('示範模式不能建立帳號');return;}
  var nm=$('ac_name').value.trim(),em=$('ac_email').value.trim(),pw=$('ac_pw').value,role=$('ac_role').value;
  if(!em||em.indexOf('@')<0){toast('請填正確 Email');return;}
  if(!pw||pw.length<6){toast('初始密碼至少 6 碼');return;}
  function writeRole(){
    dbSet(ROOT+'/roles/'+emailKey(em),{email:em,role:role,name:nm||''});
    $('ac_name').value='';$('ac_email').value='';$('ac_pw').value='';
    toast('已建立並授權：'+em);
  }
  var sec=firebase.initializeApp(firebaseConfig,'sec'+Date.now());
  sec.auth().createUserWithEmailAndPassword(em,pw)
    .then(function(){return sec.auth().signOut();})
    .then(function(){try{sec.delete();}catch(x){}writeRole();})
    .catch(function(e){
      try{sec.delete();}catch(x){}
      if(e&&e.code==='auth/email-already-in-use'){writeRole();toast('帳號已存在，已直接授權');}
      else toast('建立失敗：'+(e&&e.message||''));
    });
}
function wireSettingsStatic(){
  var root=$('page-settings');
  root.addEventListener('click',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.add){
      var key=t.dataset.add,inp=$('add_'+key),v=inp.value.trim();if(!v)return;
      if(getList(key).some(function(x){return dispName(x)===v;})||hiddenList(key).some(function(x){return dispName(x)===v;})){toast('已存在（或在隱藏區）');return;}
      getList(key).push(v);saveCfgAll();toast('已加入 '+v);return;
    }
    if(t.dataset&&t.dataset.hide!=null){
      var k=t.dataset.hide,i=Number(t.dataset.hi);
      var v2=getList(k).splice(i,1)[0];hiddenList(k).push(v2);
      saveCfgAll();toast('已隱藏 '+dispName(v2)+'（可在下方恢復）');return;
    }
    if(t.dataset&&t.dataset.realdel!=null){
      var k3=t.dataset.realdel,i3=Number(t.dataset.di),h3=hiddenList(k3);
      if(!confirm('永久刪除「'+dispName(h3[i3])+'」？此動作無法復原'))return;
      h3.splice(i3,1);saveCfgAll();toast('已永久刪除');return;
    }
    var rs=t.closest('[data-restore]');
    if(rs){
      var k4=rs.dataset.restore,i4=Number(rs.dataset.ri),h4=hiddenList(k4);
      var v4=h4.splice(i4,1)[0];getList(k4).push(v4);
      saveCfgAll();toast('已恢復 '+dispName(v4));return;
    }
    if(t.id==='acc_pick'){$('acc_img').click();return;}
    if(t.id==='acc_add'){
      var nm=$('acc_name').value.trim();if(!nm){toast('請填輔料名稱');return;}
      if((CONFIG.accessories||[]).some(function(a){return a.name===nm;})){toast('已存在');return;}
      CONFIG.accessories=CONFIG.accessories||[];
      CONFIG.accessories.push({name:nm,image:pendingAccImg||''});
      pendingAccImg='';saveCfgAll();toast('已加入 '+nm);return;
    }
    if(t.id==='ac_add'){createAccount();return;}
    if(t.dataset&&t.dataset.roledel!=null){
      var rk=t.dataset.roledel;var rr=ROLES[rk]||{};
      if(USER&&rr.email&&emailKey(USER.email)===emailKey(rr.email)){toast('不能移除自己的授權');return;}
      if(!confirm('取消「'+(rr.name||rr.email||rk)+'」的登入授權？'))return;
      dbRemove(ROOT+'/roles/'+rk);toast('已取消授權');return;
    }
  });
  root.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.gpct!=null){CONFIG.categories[Number(t.dataset.gpct)].pct=num(t.value);saveCfgAll();toast('已更新目標％');return;}
    if(t.id==='acc_img'){var f=t.files[0];if(!f)return;compressImage(f,function(url){pendingAccImg=url;var s=$('acc_state');if(s)s.textContent='已選擇圖片';toast('圖片已壓縮，按「加入」儲存');},400);}
  });
  var dragKey=null,dragIdx=null;
  root.addEventListener('dragstart',function(e){var t=e.target.closest('.tag-x[draggable]');if(!t)return;dragKey=t.dataset.key;dragIdx=Number(t.dataset.idx);});
  root.addEventListener('dragover',function(e){if(dragKey!=null)e.preventDefault();});
  root.addEventListener('drop',function(e){
    var t=e.target.closest('.tag-x[draggable]');
    if(!t||dragKey==null)return;
    e.preventDefault();
    if(t.dataset.key===dragKey){
      var to=Number(t.dataset.idx);
      if(to!==dragIdx){var l=getList(dragKey);var moved=l.splice(dragIdx,1)[0];l.splice(to,0,moved);saveCfgAll();toast('已調整順序');}
    }
    dragKey=null;dragIdx=null;
  });
}

/* ---------- 廠商版下單單 ---------- */
var sheetItem=null;
function openSheet(id){var it=ITEMS[id];if(!it)return;openSheetFromData(it);}
function openSheetFromData(it){
  sheetItem=it;
  var p=PERIODS[it.periodId]||{};
  var h='<div class="sh-title">台灣群秀下單明細</div>';
  h+='<div class="sh-sub">'+esc((p.month||'')+'｜'+(p.name||''))+'　產單日 '+new Date().toLocaleDateString('zh-TW')+'</div>';
  h+='<table class="sh-tbl"><tr>'+
    '<td class="lbl">款號</td><td style="font-weight:800;font-size:15px">'+esc(it.styleNo||'')+'</td>'+
    '<td class="lbl">款別</td><td>'+esc(it.styleType||'')+'</td>'+
    '<td class="lbl">品類</td><td>'+esc(it.category||'')+'</td>'+
    '<td class="lbl">廠商</td><td>'+esc(it.vendor||'')+'</td></tr>'+
    '<tr>'+
    '<td style="background:#FF2D2D;color:#111;font-weight:900;font-size:15px;border:2px solid #111;white-space:nowrap">交大貨日期</td>'+
    '<td style="background:#FF2D2D;color:#111;font-weight:900;font-size:16px;border:2px solid #111">'+esc(it.deliveryDate||'—')+'</td>'+
    '<td style="background:#FFF200;color:#111;font-weight:900;font-size:15px;border:2px solid #111;white-space:nowrap">交拍樣日期</td>'+
    '<td style="background:#FFF200;color:#111;font-weight:900;font-size:16px;border:2px solid #111">'+esc(it.sampleDate||'—')+'</td>'+
    '<td style="background:#FFA51F;color:#111;font-weight:900;font-size:15px;border:2px solid #111;white-space:nowrap">做貨天數</td>'+
    '<td style="background:#FFA51F;color:#111;font-weight:900;font-size:16px;border:2px solid #111" colspan="3">'+esc(it.prodDays||'—')+'</td></tr>'+
    '<tr><td class="lbl">下單日期</td><td>'+esc(it.orderDate||'')+'</td>'+
    '<td class="lbl">預計上架日</td><td>'+esc(it.onShelf||'')+'</td>'+
    '<td class="lbl">價格</td><td>'+(it.price||'')+'</td>'+
    '<td class="lbl">MOQ</td><td>'+(it.moq||'')+'</td></tr>'+
    '<tr><td class="lbl">貨運行</td><td>'+esc(it.freight||'')+'</td>'+
    '<td class="lbl">運輸方式</td><td>'+esc(it.ship||'')+'</td>'+
    '<td class="lbl">付款方式</td><td>'+esc(it.pay||'')+'</td>'+
    '<td class="lbl">輔料</td><td>'+esc(it.accessory||'')+'</td></tr>'+
    '<tr><td class="lbl">領標</td><td colspan="3">'+esc(it.labelNote||'')+'</td>'+
    '<td class="lbl">吊牌</td><td colspan="3">'+esc(it.tag||'')+'</td></tr></table>';

  h+='<div class="sh-2col">';
  var imgs=arr(it.images);if(!imgs.length&&it.image)imgs=[it.image];
  var cimgs=arr(it.colorImages);
  h+='<div>';
  h+='<div class="sh-imgbox">'+(imgs.length?imgs.map(function(u){return '<img src="'+u+'">';}).join(''):'<span style="color:var(--muted);font-size:12px">無款式圖片</span>')+'</div>';
  if(cimgs.length){h+='<div style="font-size:12px;font-weight:800;color:var(--blue-dark);margin:8px 0 4px">色卡</div><div class="sh-imgbox" style="min-height:0">'+cimgs.map(function(u){return '<img src="'+u+'">';}).join('')+'</div>';}
  h+='</div>';
  h+='<div class="sh-notes"><div class="nt">備註</div>'+(it.notes||'<span style="color:var(--muted)">—</span>')+'</div>';
  h+='</div>';
  var meas=arr(it.measurements).filter(function(m){return String(m.value==null?'':m.value).trim()!=='';});
  if(meas.length){
    h+='<table class="sh-tbl" style="max-width:420px"><tr><th colspan="2">訂貨尺寸（cm）</th></tr>';
    meas.forEach(function(m){h+='<tr><td class="lbl">'+esc(m.name||'')+'</td><td>'+esc(m.value||'')+'</td></tr>';});
    h+='</table>';
  }
  var rows=arr(it.rows);var tq=0;
  h+='<table class="sh-tbl" style="max-width:420px"><tr><th>顏色</th><th>尺寸</th><th>數量</th></tr>';
  rows.forEach(function(r){tq+=num(r.orderQty);h+='<tr><td>'+esc(r.color||'')+'</td><td>'+esc(r.size||'')+'</td><td style="font-weight:700">'+fmt(num(r.orderQty))+'</td></tr>';});
  h+='<tr><td class="lbl" colspan="2">合計</td><td style="font-weight:800">'+fmt(tq)+'</td></tr></table>';
  h+='<div class="sh-foot">※ 大貨可接受的尺寸誤差須小於 ±2cm<br>※ 棉麻需先水洗防縮水處理後才可交貨<br>※ 出貨時間若有變動請提前 3 日以上通知</div>';
  $('sheetBody').innerHTML=h;
  $('sheetModal').hidden=false;
}
function wireSheet(){
  $('sheetClose').addEventListener('click',function(){$('sheetModal').hidden=true;});
  $('sheetModal').addEventListener('click',function(e){if(e.target===this)this.hidden=true;});
  $('sheetPrint').addEventListener('click',function(){window.print();});
  $('sheetJpg').addEventListener('click',function(){
    if(typeof html2canvas==='undefined'){toast('圖片元件載入失敗，請檢查網路後重新整理');return;}
    var it=sheetItem||{};
    toast('產生圖片中…');
    html2canvas($('sheetBody'),{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(function(cv){
      var a=document.createElement('a');
      a.href=cv.toDataURL('image/jpeg',0.92);
      a.download='下單單_'+(it.styleNo||'item')+'.jpg';
      document.body.appendChild(a);a.click();a.remove();
      toast('已下載 JPG，可直接傳給廠商');
    });
  });
}

/* ---------- Excel 匯出 ---------- */
function exportExcel(){
  if(!isAdmin()){toast('僅主管可匯出');return;}
  if(typeof XLSX==='undefined'){toast('Excel 元件載入失敗，請檢查網路後重新整理');return;}
  var pids=ovPeriod==='all'?periodsOfMonth(ovMonth):[ovPeriod];
  var ids=itemsOfPeriods(pids);
  if(!ids.length){toast('目前範圍沒有款式資料');return;}
  var scopeName=ovMonth+(ovPeriod==='all'?'_整月':'_'+(((PERIODS[ovPeriod]||{}).name)||'檔期'));

  var s1=[['檔期','上架日','款數','下單件數','下單金額','已配件數','官網件數','門市件數','官網佔比']];
  pids.forEach(function(pid){
    var p=PERIODS[pid];var pi=itemsOfPeriods([pid]);
    var oq=0,aq=0,amt=0,wq=0;
    pi.forEach(function(id){var it=ITEMS[id];var pr=num(it.price);arr(it.rows).forEach(function(r){var o=num(r.orderQty);oq+=o;aq+=rowAllocCfg(r);amt+=o*pr;wq+=num(r.web);});});
    s1.push([p.name||'',p.date||'',pi.length,oq,Math.round(amt),aq,wq,aq-wq,(aq>0?Math.round(wq/aq*100)+'%':'')]);
  });

  var s2=[['檔期','款號','款別','品類','大類','廠商','單價','訂購件數','已配件數','留倉件數','下單金額','下單日期','交拍樣日期','交大貨日期','做貨天數','預計上架日','貨運行','運輸方式','付款方式','MOQ','輔料','領標','吊牌']];
  ids.forEach(function(id){
    var it=ITEMS[id];var p=PERIODS[it.periodId]||{};
    var ot=itemOrderTotal(it),at=itemAllocTotalCfg(it);
    s2.push([p.name||'',it.styleNo||'',it.styleType||'',it.category||'',it.categoryGroup||'',it.vendor||'',num(it.price),ot,at,ot-at,Math.round(ot*num(it.price)),it.orderDate||'',it.sampleDate||'',it.deliveryDate||'',it.prodDays||'',it.onShelf||'',it.freight||'',it.ship||'',it.pay||'',num(it.moq)||'',it.accessory||'',it.labelNote||'',it.tag||'']);
  });

  var h3=['檔期','款號','顏色','尺寸','訂購數'].concat(CONFIG.stores).concat(['官網','已配','留倉']);
  var s3=[h3];
  ids.forEach(function(id){
    var it=ITEMS[id];var p=PERIODS[it.periodId]||{};
    arr(it.rows).forEach(function(r){
      var row=[p.name||'',it.styleNo||'',r.color||'',r.size||'',num(r.orderQty)];
      CONFIG.stores.forEach(function(s){row.push(num(r.alloc&&r.alloc[s]));});
      var ra=rowAllocCfg(r);
      row.push(num(r.web),ra,num(r.orderQty)-ra);
      s3.push(row);
    });
  });

  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s1),'檔期摘要');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s2),'款式清單');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s3),'配貨明細');
  XLSX.writeFile(wb,'採購配貨_'+scopeName+'.xlsx');
  toast('已匯出 Excel');
}

wireSheet();
init();
</script>
